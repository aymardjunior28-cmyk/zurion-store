services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zurion
      POSTGRES_USER: zurion
      POSTGRES_PASSWORD: zurion_dev_password
    ports:
      - "5432:5432"
    volumes:
      - zurion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zurion -d zurion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zurion-postgres-data:
